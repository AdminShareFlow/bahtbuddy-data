name: Mise à jour des lieux

on:
  schedule:
    - cron: "17 3 * * 1"   # chaque lundi à 03:17 UTC (10:17 en Thaïlande)
  workflow_dispatch:         # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Outils
        run: pip install duckdb shapely

      - name: Télécharger et fusionner les lieux
        run: python scripts/build.py

      - name: Publier
        run: |
          git config user.name "bahtbuddy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add places-th.json meta.json
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour des lieux $(date -u +%F)"
          git pull --rebase origin main
          git push
